name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTEXTE.md
          test -s CLAUDE.md
          test -s src/main.c
          test -s Makefile
          grep -q 'diagnostic prototype' src/main.c
          grep -q 'No game image is bundled' src/main.c

      - name: Host syntax check
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only src/main.c
